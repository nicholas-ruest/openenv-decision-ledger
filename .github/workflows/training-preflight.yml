name: Private training CPU preflight
on:
  pull_request:
    paths:
      - 'training/**'
      - 'tests/training/**'
      - 'config/private-training-preparation.json'
      - 'scripts/training-preflight.sh'
      - '.github/workflows/training-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact tested CPU dependencies
        run: python -m pip install -r training/requirements-cpu.lock
      - name: Adapter and offline optimizer preflight
        env:
          TRAINING_SMOKE_OUTPUT: '${{ runner.temp }}/training-cpu-smoke'
        run: |
          export TRAINING_PYTHON="$(command -v python)"
          bash scripts/training-preflight.sh
      - uses: actions/upload-artifact@v4
        with:
          name: training-cpu-preflight-report
          path: '${{ runner.temp }}/training-cpu-smoke/report.json'
