name: Media protocol archive validation
on:
  push:
    branches: ['research/software-stage-calibration-20261027']
    paths: ['research/media-protocol-20261027/**', '.github/workflows/media-protocol.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-preserved-native-captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protocol regression tests
        run: python -m unittest discover -s research/media-protocol-20261027 -p 'test_*.py'
      - name: Rebuild plan from preserved native image captures
        run: |
          mkdir evidence
          PYTHONPATH=research/media-protocol-20261027 python -c "import json,hashlib; from pathlib import Path; from media_protocol import build; r=Path('research/media-protocol-20261027'); p=r/'native-captures.json'; origin=json.loads((r/'capture-origin.json').read_text()); assert hashlib.sha256(p.read_bytes()).hexdigest()==origin['capture_file_sha256']; d=json.loads(p.read_text()); plan=build(d['captures'],d['schema']); assert plan['new_model_calls']==0 and plan['budget_admitted'] is False and len(plan['shared_initial_prompt_hashes'])==4; Path('evidence/media-plan-native.json').write_text(json.dumps(plan,sort_keys=True,indent=2))"
      - uses: actions/upload-artifact@v4
        with:
          name: media-plan-native-validated
          retention-days: 7
          path: evidence/
