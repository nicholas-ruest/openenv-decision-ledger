name: Media raw trajectory audit
on:
  push:
    branches: ['research/software-stage-calibration-20261027']
    paths: ['research/media-trajectory-audit-20261028/**', '.github/workflows/media-trajectory-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: media-trajectory-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-and-frozen-native-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/nicholas-ruest/openenv-decision-ledger@sha256:b80078c2cc8a05d3222fe22ee91321d29d881afff912097c6601a8cffd84c4e6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evidence rejection and outcome classification tests
        run: PYTHONPATH=research/media-protocol-20261027 python -m unittest discover -s research/media-trajectory-audit-20261028 -p 'test_*.py'
      - name: Anonymous frozen image scripted trajectories and native replay
        run: |
          export DOCKER_CONFIG=$(mktemp -d)
          mkdir evidence
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" > evidence/image-inspect.json
          python -c "import json; d=json.load(open('evidence/image-inspect.json'))[0]; assert d['Architecture']=='amd64' and d['Os']=='linux'; assert d['Config']['Entrypoint']==['/usr/bin/tini','--']"
          docker run -d --name media "$IMAGE"
          trap 'docker logs media > evidence/server.log 2>&1; docker rm -f media' EXIT
          for n in $(seq 1 60); do
            if docker exec media python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=1)" 2>/dev/null; then break; fi
            sleep 1
          done
          docker exec media mkdir -m 700 /audit
          for name in trajectory_audit.py native_controls.py; do docker cp "research/media-trajectory-audit-20261028/$name" "media:/audit/$name"; done
          for name in media_protocol.py native-captures.json; do docker cp "research/media-protocol-20261027/$name" "media:/audit/$name"; done
          timeout 300s docker exec media python /audit/native_controls.py > evidence/native-trajectories.json
          python -c "import json; r=json.load(open('evidence/native-trajectories.json')); assert r['scripted_trajectories']==11 and r['native_replay_episodes']==11 and r['new_model_calls']==0 and r['provider_fields_synthetic']; print('11 scripted trajectories independently replayed; zero model calls')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-trajectory-audit-native
          retention-days: 7
          path: evidence/
