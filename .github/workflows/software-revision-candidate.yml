name: Native software revision candidate controls
on:
  push:
    branches: ['research/software-stage-calibration-20261027']
    paths: ['research/software-revision-candidate-20261028/**', '.github/workflows/software-revision-candidate.yml']
permissions:
  contents: read
jobs:
  native-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      IMAGE: ghcr.io/nicholas-ruest/openenv-decision-ledger@sha256:9455e57ef88fe99d94a0f0b32651c1f52472f9aba6da68c11a68db18c936ed22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise revision candidate over frozen software runtime dependencies
        run: |
          export DOCKER_CONFIG=$(mktemp -d)
          docker pull "$IMAGE"
          docker run --rm --entrypoint python -v "$PWD:/research:ro" -e PYTHONPATH=/research/research/software-revision-candidate-20261028:/research/research/software-public-check-20261028:/app "$IMAGE" -m unittest discover -s /research/research/software-revision-candidate-20261028 -p 'test_*.py'
      - name: Scripted native WebSocket controls over the experimental app
        run: |
          export DOCKER_CONFIG=$(mktemp -d)
          docker run -d --name revision --entrypoint python -v "$PWD:/research:ro" -e PYTHONPATH=/research/research/software-revision-candidate-20261028:/research/research/software-public-check-20261028:/app "$IMAGE" -m uvicorn revision_app:app --host 0.0.0.0 --port 8000
          trap 'docker logs revision; docker rm -f revision' EXIT
          for n in $(seq 1 60); do
            if docker exec revision python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=1)" 2>/dev/null; then break; fi
            sleep 1
          done
          timeout 75s docker exec revision python /research/research/software-revision-candidate-20261028/native_ws_controls.py
