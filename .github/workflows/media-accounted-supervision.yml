name: Independent accounted native media supervision
on:
  push:
    branches: ['research/software-stage-calibration-20261027']
    paths: ['research/media-accounted-supervision-20261028/**', '.github/workflows/media-accounted-supervision.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-image-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/nicholas-ruest/openenv-decision-ledger@sha256:b80078c2cc8a05d3222fe22ee91321d29d881afff912097c6601a8cffd84c4e6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install websockets==17.2
      - run: PYTHONPATH=.:research/media-accounted-supervision-20261028:research/media-accounting-audit-20261028:research/media-observation-accounting-20261028:research/media-durable-phase-20261028:research/media-protocol-20261027:research/media-trajectory-audit-20261028:research/software-evidence-bind-20261027 python -m unittest discover -s research/media-accounted-supervision-20261028 -p 'test_*.py'
      - name: Actual native phase under local supervisor with scripted responses only
        run: |
          export DOCKER_CONFIG=$(mktemp -d)
          mkdir evidence
          docker pull "$IMAGE"
          docker run -d --name media "$IMAGE"
          trap 'docker logs media > evidence/server.log 2>&1; docker cp media:/accounted-composition-evidence evidence/archive || true; docker rm -f media' EXIT
          for n in $(seq 1 60); do
            if docker exec media python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=1)" 2>/dev/null; then break; fi
            sleep 1
          done
          docker exec media mkdir -m 700 /integration
          docker cp research/media-native-composition-20261028/native_bridge.py media:/integration/native_bridge.py
          for name in accounted_supervisor.py fixture_counter.py native_worker.py native_verifier.py native_composition.py; do docker cp "research/media-accounted-supervision-20261028/$name" "media:/integration/$name"; done
          for name in accounting_archive.py verified_phase.py; do docker cp "research/media-accounting-audit-20261028/$name" "media:/integration/$name"; done
          docker cp research/media-observation-accounting-20261028/observation_budget.py media:/integration/observation_budget.py
          docker cp research/media-websocket-20261028/native_session.py media:/integration/native_session.py
          docker cp research/media-supervision-20261028/phase_supervisor.py media:/integration/phase_supervisor.py
          docker cp research/media-durable-phase-20261028/media_durable.py media:/integration/media_durable.py
          for name in durable_phase.py raw_evidence.py; do docker cp "research/software-evidence-bind-20261027/$name" "media:/integration/$name"; done
          docker cp research/media-trajectory-audit-20261028/trajectory_audit.py media:/integration/trajectory_audit.py
          for name in media_protocol.py native-captures.json; do docker cp "research/media-protocol-20261027/$name" "media:/integration/$name"; done
          docker exec media mkdir -m 700 /integration/training
          docker exec media touch /integration/training/__init__.py
          docker cp training/lifecycle.py media:/integration/training/lifecycle.py
          timeout 200s docker exec -e PYTHONPATH=/integration:/app media python /integration/native_composition.py > evidence/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-accounted-supervision-evidence
          path: evidence/
          retention-days: 7
