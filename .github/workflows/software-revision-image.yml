name: Build and anonymously qualify software revision image
on:
  push:
    branches: ['research/software-stage-calibration-20261027']
    paths: ['research/software-revision-image-20261028/**', '.github/workflows/software-revision-image.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build candidate from frozen dependencies
        run: docker build --platform linux/amd64 --label org.opencontainers.image.revision="$GITHUB_SHA" -f research/software-revision-image-20261028/Dockerfile -t revision-candidate .
      - name: Candidate native unit controls before publication
        run: docker run --rm --entrypoint python -v "$PWD:/research:ro" -e PYTHONPATH=/app revision-candidate -m unittest discover -s /research/research/software-revision-candidate-20261028 -p 'test_*.py'
      - name: Publish separately named candidate tag
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          TAG="ghcr.io/nicholas-ruest/openenv-decision-ledger:software-revision-$GITHUB_SHA"
          docker tag revision-candidate "$TAG"
          docker push "$TAG"
          DIGEST=$(docker inspect "$TAG" --format '{{index .RepoDigests 0}}')
          echo "image=$DIGEST" >> "$GITHUB_OUTPUT"
  anonymous-qualification:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Anonymous pull and native SDK/schema/episode controls
        run: |
          export DOCKER_CONFIG=$(mktemp -d)
          mkdir evidence
          docker pull "$IMAGE"
          docker run -d --name revision "$IMAGE"
          trap 'docker logs revision > evidence/server.log 2>&1; docker rm -f revision' EXIT
          for n in $(seq 1 60); do
            if docker exec revision python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=1)" 2>/dev/null; then break; fi
            sleep 1
          done
          docker exec revision openenv validate --url http://127.0.0.1:8000 > evidence/sdk.txt
          docker cp research/software-revision-image-20261028/qualification.py revision:/tmp/qualification.py
          docker cp research/software-revision-candidate-20261028/native_ws_controls.py revision:/tmp/native_ws_controls.py
          docker exec -e PYTHONPATH=/app revision python /tmp/qualification.py > evidence/schema.json
          timeout 75s docker exec -e PYTHONPATH=/app revision python /tmp/native_ws_controls.py > evidence/native.json
          docker image inspect "$IMAGE" --format '{{json .Config}}' > evidence/image-config.json
          printf '%s\n' "$IMAGE" > evidence/image.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-revision-image-qualification
          path: evidence/
          retention-days: 7
