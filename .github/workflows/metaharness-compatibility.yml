name: Pinned MetaHarness terminal compatibility
on:
  push:
    branches: ['research/software-stage-calibration-20261027']
    paths: ['research/metaharness-compatibility-20261028/**', '.github/workflows/metaharness-compatibility.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-actual-modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test research/metaharness-compatibility-20261028/test_adapter.mjs
