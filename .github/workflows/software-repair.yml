name: Software repair candidate native validation
on:
  pull_request:
    paths:
      - 'integrations/software-repair/**'
      - '.github/workflows/software-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      direct_image: ${{ steps.publish.outputs.direct_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native SDK and test dependencies
        run: python -m pip install -r integrations/openenv-arena/requirements.lock -r integrations/openenv-arena/requirements-dev.lock
      - name: Seeded independent controls and interpreter rejection tests
        run: PYTHONPATH=integrations/software-repair python -m pytest integrations/software-repair/tests -q
      - name: Build amd64 environment
        run: docker build --platform linux/amd64 -f integrations/software-repair/Dockerfile -t software-repair:candidate .
      - name: Build separate direct-code experimental environment
        run: docker build --platform linux/amd64 -f integrations/software-repair/Dockerfile.direct -t software-direct:candidate .
      - uses: docker/login-action@v3
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'candidate/software-repair-v3'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exclusive candidate tag in existing public package
        id: publish
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'candidate/software-repair-v3'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TAG="ghcr.io/nicholas-ruest/openenv-decision-ledger:software-repair-$SOURCE_SHA"
          docker tag software-repair:candidate "$TAG"
          docker push "$TAG" | tee repair-push.txt
          DIGEST=$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' repair-push.txt)
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE="ghcr.io/nicholas-ruest/openenv-decision-ledger@$DIGEST"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          DIRECT_TAG="ghcr.io/nicholas-ruest/openenv-decision-ledger:software-direct-$SOURCE_SHA"
          docker tag software-direct:candidate "$DIRECT_TAG"
          docker push "$DIRECT_TAG" | tee direct-push.txt
          DIRECT_DIGEST=$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' direct-push.txt)
          [[ "$DIRECT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          DIRECT_IMAGE="ghcr.io/nicholas-ruest/openenv-decision-ledger@$DIRECT_DIGEST"
          echo "direct_image=$DIRECT_IMAGE" >> "$GITHUB_OUTPUT"
  anonymous-direct:
    needs: test-publish
    if: needs.test-publish.outputs.direct_image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: ${{ needs.test-publish.outputs.direct_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r integrations/openenv-arena/requirements.lock -r integrations/openenv-arena/requirements-dev.lock
      - name: Anonymous direct-code OpenEnv validation and unchanged-grader controls
        run: |
          export DOCKER_CONFIG=$(mktemp -d)
          docker pull "$IMAGE"
          docker run -d --name direct --read-only --tmpfs /tmp:rw,size=256m -p 8000:8000 "$IMAGE"
          for n in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && break || sleep 2; done
          openenv validate --url http://127.0.0.1:8000
          mkdir -p evidence
          python integrations/software-repair/scripts/replay_direct_native.py --url http://127.0.0.1:8000 --output evidence/direct-native.json
          echo "$IMAGE" > evidence/image.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-direct-experimental-evidence
          retention-days: 7
          path: evidence/
      - name: Cleanup
        if: always()
        run: docker rm -f direct || true
  anonymous-replay:
    needs: test-publish
    if: needs.test-publish.outputs.image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ${{ needs.test-publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r integrations/openenv-arena/requirements.lock -r integrations/openenv-arena/requirements-dev.lock
      - name: Anonymous pull, native SDK validation and seeded-control replay
        run: |
          export DOCKER_CONFIG=$(mktemp -d)
          docker pull "$IMAGE"
          docker run -d --name repair --read-only --tmpfs /tmp:rw,size=256m -p 8000:8000 "$IMAGE"
          for n in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && break || sleep 2; done
          openenv validate --url http://127.0.0.1:8000
          mkdir -p evidence
          python integrations/software-repair/scripts/replay_native.py --url http://127.0.0.1:8000 --output evidence/native-replay.json
          python integrations/software-repair/scripts/export_dataset.py --image "$IMAGE" --output evidence/dataset-candidate
          echo "$IMAGE" > evidence/image.txt
          echo '${{ github.event.pull_request.head.sha || github.sha }}' > evidence/source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-repair-candidate-evidence
          retention-days: 7
          path: evidence/
      - name: Cleanup
        if: always()
        run: docker rm -f repair || true
