name: Media generation plus observation accounting
on:
  push:
    branches: ['research/software-stage-calibration-20261027']
    paths: ['research/media-observation-accounting-20261028/**', '.github/workflows/media-observation-accounting.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-accounted-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=research/media-durable-phase-20261028:research/media-protocol-20261027:research/media-trajectory-audit-20261028:research/software-evidence-bind-20261027 python -m unittest discover -s research/media-observation-accounting-20261028 -p 'test_*.py'
